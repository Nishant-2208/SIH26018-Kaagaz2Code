version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kaagaz2code-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaagaz2code
      POSTGRES_PASSWORD: kaagaz2code
      POSTGRES_DB: kaagaz2code
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaagaz2code"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local dev. Original scanned documents
  # and processed derivatives are stored here; production points
  # OBJECT_STORAGE_* env vars at a real cloud bucket instead.
  minio:
    image: minio/minio:latest
    container_name: kaagaz2code-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: kaagaz2code-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  backend:
    build: .
    container_name: kaagaz2code-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://kaagaz2code:kaagaz2code@postgres:5432/kaagaz2code
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic

volumes:
  postgres_data:
  minio_data:
